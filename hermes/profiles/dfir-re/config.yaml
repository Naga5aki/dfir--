model:
  default: qwen3.8-27b-forensics
  provider: local-think
  context_length: 65536
  api_mode: chat_completions

# 同一台 llama-server 的两个“模型入口”：
#   /model think -> 开启思考
#   /model plain -> 关闭思考
providers:
  local-think:
    base_url: http://127.0.0.1:8095/v1
    api_key: ${LLAMA_API_KEY}
    api_mode: chat_completions
    model: qwen3.8-27b-forensics
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
    models:
      qwen3.8-27b-forensics: {}
  local-plain:
    base_url: http://127.0.0.1:8095/v1
    api_key: ${LLAMA_API_KEY}
    api_mode: chat_completions
    model: qwen3.8-27b-forensics
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    models:
      qwen3.8-27b-forensics: {}

model_aliases:
  think:
    model: qwen3.8-27b-forensics
    provider: local-think
  plain:
    model: qwen3.8-27b-forensics
    provider: local-plain

terminal:
  # 本机后端：read_file/shell 在 Windows 执行，才能读取 D 盘逆向样本与挂载盘
  backend: local
  cwd: "D:/forensics/cases"
  timeout: 180
  persistent_shell: true

mcp_servers:
  ida:
    url: "http://127.0.0.1:8737/mcp"
    enabled: true
    timeout: 600
    tools:
      include:
        - open_database
        - execute_python
        - reference
        - list_databases
        - save_database
        - close_database
  jadx:
    command: C:\Users\TWK\.local\bin\uv.exe
    args:
      - --directory
      - D:\CTF_Misc_Tools\reverse\jadx\jadx-mcp-server
      - run
      - jadx_mcp_server.py
    connect_timeout: 90.0
    enabled: true
    timeout: 600
    cwd: D:/Hermes/SecurityLab/work/jadx
  case_fs:
    command: C:/Program Files/nodejs/node.exe
    args:
      - D:/ForensicsAgent/hermes/mcp-runtime/case-fs-2026.8.31/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js
      - "D:/forensics/cases"
    enabled: true
    tools:
      include:
        - read_file
        - read_multiple_files
        - list_directory
        - directory_tree
        - search_files
        - get_file_info
      resources: false
      prompts: false
    timeout: 120

agent:
  max_turns: 32
  run_budget_seconds: 1500
  save_trajectories: true

display:
  show_reasoning: true
  streaming: true
  language: zh
  tool_progress: all

memory:
  memory_enabled: true
  user_profile_enabled: false
  nudge_interval: 0
  # 字符数，不是字节数。默认 2200 会挡住追加；内容本身不压缩。
  memory_char_limit: 4000

tool_loop_guardrails:
  hard_stop_enabled: true

_config_version: 51

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web

gateway:
  standalone: true

hooks:
  pre_llm_call:
    - command: "D:/llm/ensure_local_ready.py --hook"
      timeout: 180
    - command: "D:/ForensicsAgent/hermes/bin/dfir_router.py"
      timeout: 10

hooks_auto_accept: true

telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
auxiliary:
  title_generation:
    model_upgrade_enabled: false

# Allow the local loading wait to finish before the hook dispatcher continues.
plugins:
  hook_callback_timeout: 200

